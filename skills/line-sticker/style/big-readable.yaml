  High contrast charcoal lettering with white stroke; preserve all Thai vowels and tone marks.
  White die-cut border, tiny transparent safety margin, nothing cropped, no extra words or watermark.
  Avoid square artwork floating on a tall empty canvas, thin lettering, busy decorations or distortion.
